name: Plan Manager
options:
  bundleIdPrefix: com.planmanager
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
  generateEmptyDirectories: true
  createIntermediateGroups: true
  defaultConfig: Release

settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.65"
    CURRENT_PROJECT_VERSION: "2"
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"

targets:
  Plan Manager:
    type: application
    platform: iOS
    sources:
      - path: Plan Manager
        type: group
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.planmanager.app
        TARGETED_DEVICE_FAMILY: 1
        INFOPLIST_KEY_CFBundleDisplayName: "Plan Manager"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Plan Manager/Info.plist
      properties:
        CFBundleDisplayName: "Plan Manager"
        CFBundleShortVersionString: "1.65"
        CFBundleVersion: "2"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: com.planmanager.addPlan
            UIApplicationShortcutItemTitle: 添加计划
            UIApplicationShortcutItemIconType: UIApplicationShortcutIconTypeCompose
          - UIApplicationShortcutItemType: com.planmanager.addExpense
            UIApplicationShortcutItemTitle: 快速记账
            UIApplicationShortcutItemIconType: UIApplicationShortcutIconTypeAdd

  FitnessTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FitnessTests
    dependencies:
      - target: Plan Manager
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.planmanager.fitness.tests

  FitnessUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: FitnessUITests
    dependencies:
      - target: Plan Manager
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.planmanager.fitness.uitests

schemes:
  Plan Manager:
    build:
      targets:
        Plan Manager: all
    run:
      config: Debug
    archive:
      config: Release
    test:
      config: Debug
      targets:
        - FitnessTests
        - FitnessUITests
